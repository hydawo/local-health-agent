<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1032 592" width="1032" height="592" role="img" aria-label="How a literature pack is built, published, installed and refreshed, then the three modules that can reach the network, then the offline check that proves the local tier.">
<title>How a literature pack is built, published, installed and refreshed, then the three modules that can reach the network, then the offline check that proves the local tier.</title>
<style>
  :root{--bg:#f5f7f6;--surface:#ffffff;--fg:#17201d;--muted:#5b6964;--line:#b9c6c1;
    --accent:#1f6f5c;--accent-soft:#dcefe8;--human:#a2552a;--human-soft:#f8e7dc;
    --agent:#3d5fa8;--agent-soft:#e3eaf8;--guard:#b3413c;--guard-soft:#f8e3e1;
    --net:#a8690f;--net-soft:#fbefd9;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  @media (prefers-color-scheme:dark){:root{--bg:#111816;--surface:#18211e;--fg:#e4ebe8;--muted:#9aaba5;--line:#3a4a45;
    --accent:#5cc3a6;--accent-soft:#1d3a32;--human:#eda077;--human-soft:#3a271c;
    --agent:#8fb0ee;--agent-soft:#1c2840;--guard:#e07068;--guard-soft:#3a1f1d;
    --net:#e0a94b;--net-soft:#332912}}

  text{font-family:var(--body);fill:var(--fg)}
  .t{font-size:15px;font-weight:600}
  .s{font-size:12px;fill:var(--muted)}
  .x{font-size:11px;fill:var(--muted)}
  .m{font-family:var(--mono);font-size:11.5px;fill:var(--fg)}
  .mn{font-family:var(--mono);font-size:10.5px;fill:var(--fg)}
  .hd{font-size:11.5px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}
  .lbl{font-size:11.5px;fill:var(--muted);font-style:italic}
  .human{fill:var(--human-soft);stroke:var(--human);stroke-width:1.5}
  .agent{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
  .coord{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
  .guard{fill:var(--guard-soft);stroke:var(--guard);stroke-width:1.8}
  .guardd{fill:var(--guard-soft);stroke:var(--guard);stroke-width:1.5;stroke-dasharray:6 4}
  .net{fill:var(--net-soft);stroke:var(--net);stroke-width:1.5}
  .netd{fill:var(--net-soft);stroke:var(--net);stroke-width:1.5;stroke-dasharray:6 4}
  .kb{fill:var(--surface);stroke:var(--fg);stroke-width:1.8}
  .out{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
  .w{fill:none;stroke:var(--line);stroke-width:1.8}
  .wd{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}
  .wa{fill:none;stroke:var(--accent);stroke-width:2}
  .wg{fill:none;stroke:var(--agent);stroke-width:1.8}
  .wgd{fill:none;stroke:var(--guard);stroke-width:1.8;stroke-dasharray:6 4}
  .wn{fill:none;stroke:var(--net);stroke-width:1.8;stroke-dasharray:6 4}
  .wnn{fill:none;stroke:var(--net);stroke-width:1.8}
  .bound{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:8 5}
  .ah{fill:var(--line)}.aa{fill:var(--accent)}.ag{fill:var(--agent)}
  .agd{fill:var(--guard)}.an{fill:var(--net)}
</style>
<rect x="-16" y="-16" width="1032" height="592" fill="var(--bg)"/>
<defs>
      <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
      <marker id="d1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aa"/></marker>
      <marker id="d1n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="an"/></marker>
    </defs>
    <text x="30" y="26" class="hd">FROM PUBMED TO YOUR MACHINE</text>

    <rect x="30" y="40" width="164" height="96" rx="10" class="net"/>
    <text x="112" y="64" text-anchor="middle" class="t">🌐 NCBI</text>
    <text x="112" y="84" text-anchor="middle" class="x">E-utilities</text>
    <text x="112" y="100" text-anchor="middle" class="x">Public PubMed records</text>
    <rect x="224" y="40" width="164" height="96" rx="10" class="agent"/>
    <text x="306" y="64" text-anchor="middle" class="t">🏗️ build-pack</text>
    <text x="306" y="84" text-anchor="middle" class="x">Maintainer, per release</text>
    <text x="306" y="100" text-anchor="middle" class="x">Date slices under 10,000</text>
    <text x="306" y="116" text-anchor="middle" class="x">Retries transient errors</text>
    <rect x="418" y="40" width="164" height="96" rx="10" class="net"/>
    <text x="500" y="64" text-anchor="middle" class="t">📦 GitHub release</text>
    <text x="500" y="84" text-anchor="middle" class="x">packs-v1, 5 gzipped files</text>
    <text x="500" y="100" text-anchor="middle" class="x">Each with a sha256 file</text>
    <rect x="612" y="40" width="164" height="96" rx="10" class="coord"/>
    <text x="694" y="64" text-anchor="middle" class="t">⬇️ literature install</text>
    <text x="694" y="84" text-anchor="middle" class="x">Shows a notice, asks first</text>
    <text x="694" y="100" text-anchor="middle" class="x">Verifies the sha256</text>
    <rect x="806" y="40" width="164" height="96" rx="10" class="kb"/>
    <text x="888" y="64" text-anchor="middle" class="t">📚 literature.db</text>
    <text x="888" y="84" text-anchor="middle" class="x">One row per PMID</text>
    <text x="888" y="100" text-anchor="middle" class="x">Embedded with the</text>
    <text x="888" y="116" text-anchor="middle" class="x">local model</text>
    <path d="M194 88 L222 88" class="wn" marker-end="url(#d1n)"/>
    <path d="M388 88 L416 88" class="wnn" marker-end="url(#d1n)"/>
    <path d="M582 88 L610 88" class="wnn" marker-end="url(#d1n)"/>
    <path d="M776 88 L804 88" class="wa" marker-end="url(#d1a)"/>

    <rect x="806" y="176" width="164" height="96" rx="10" class="net"/>
    <text x="888" y="200" text-anchor="middle" class="t">🔄 literature refresh</text>
    <text x="888" y="220" text-anchor="middle" class="x">Asks NCBI from your</text>
    <text x="888" y="236" text-anchor="middle" class="x">machine, adds abstracts</text>
    <text x="888" y="252" text-anchor="middle" class="x">and marks retractions.</text>
    <path d="M888 176 L888 138" class="wnn" marker-end="url(#d1n)"/>
    <text x="780" y="262" text-anchor="end" class="lbl">never runs on its own</text>

    <rect x="30" y="176" width="300" height="96" rx="10" class="coord"/>
    <text x="180" y="200" text-anchor="middle" class="t">🗒️ visit-prep</text>
    <text x="180" y="220" text-anchor="middle" class="x">No language model at all</text>
    <text x="180" y="236" text-anchor="middle" class="x">Questions to ask, each tied to your own value.</text>
    <text x="180" y="252" text-anchor="middle" class="x">Reads the index and, if installed, literature.db.</text>

    <text x="30" y="316" class="hd">THREE MODULES CAN REACH THE NETWORK</text>
    <rect x="30" y="330" width="300" height="100" rx="10" class="agent"/>
    <text x="46" y="354" class="mn">ollama_client.py</text>
    <text x="46" y="374" class="t">Local model</text>
    <text x="46" y="394" class="x">Loopback only. A non-loopback host is</text>
    <text x="46" y="410" class="x">refused unless you explicitly opt in.</text>
    <rect x="350" y="330" width="300" height="100" rx="10" class="netd"/>
    <text x="366" y="354" class="mn">agent/backends.py</text>
    <text x="366" y="374" class="t">Cloud tier</text>
    <text x="366" y="394" class="x">Anthropic API, only after recorded consent.</text>
    <text x="366" y="410" class="x">Needs the optional cloud install.</text>
    <rect x="670" y="330" width="300" height="100" rx="10" class="net"/>
    <text x="686" y="354" class="mn">literature/fetch/client.py</text>
    <text x="686" y="374" class="t">Packs and refresh</text>
    <text x="686" y="394" class="x">Four hosts, https only. No credentials in</text>
    <text x="686" y="410" class="x">URLs. Scheme and host rechecked on redirects.</text>

    <rect x="30" y="456" width="940" height="92" rx="10" class="coord"/>
    <text x="46" y="480" class="t">🔒 offline-check</text>
    <text x="180" y="480" class="x">Runs ingest, OCR, aggregation, lab trends, vector search and seven of the eight agent tools with network sockets denied.</text>
    <text x="46" y="504" class="x">Kernel sandbox where available (sandbox-exec on macOS, unshare on Linux), which also covers native code like the vector store.</text>
    <text x="46" y="522" class="x">A Python-level fallback covers only what goes through Python. The two are reported separately. CI runs the check on macOS and Linux.</text>
</svg>
